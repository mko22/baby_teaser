<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haloooo Mariam</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink:    #e8559a;
    --pink2:   #f27bb8;
    --pink3:   #fbaed3;
    --purple:  #9b59d0;
    --purple2: #b97ae0;
    --purple3: #d8b4f8;
    --cream:   #fff0f7;
    --white:   #ffffff;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    background: #0d0512;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── layered aurora background ── */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    animation: drift ease-in-out infinite alternate;
  }
  .orb1 { width: 600px; height: 600px; background: var(--purple); top: -15%; left: -15%; animation-duration: 14s; }
  .orb2 { width: 500px; height: 500px; background: var(--pink);   bottom: -10%; right: -10%; animation-duration: 11s; }
  .orb3 { width: 350px; height: 350px; background: var(--purple2); top: 30%; right: 5%; animation-duration: 17s; opacity: 0.3; }
  .orb4 { width: 280px; height: 280px; background: var(--pink2);   bottom: 20%; left: 10%; animation-duration: 13s; opacity: 0.25; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.12); }
  }

  /* stars */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: 0.7; transform: scale(1.2); }
  }

  /* floating petals */
  .petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute;
    border-radius: 100% 0 100% 0;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-40px) rotate(0deg);   opacity: 0; }
    5%   { opacity: 0.7; }
    95%  { opacity: 0.5; }
    100% { transform: translateY(110vh) rotate(520deg); opacity: 0; }
  }

  /* ── main card ── */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 64px 56px 72px;
    max-width: 560px;
    width: calc(100% - 32px);
    border-radius: 32px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(28px) saturate(1.4);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    animation: cardIn 1.2s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  /* top shimmer line */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,180,220,0.6), rgba(200,140,255,0.6), transparent);
    border-radius: 1px;
  }

  /* ── floating hearts deco ── */
  .hearts-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .h-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: pulse2 2.5s ease-in-out infinite;
  }
  .h-dot:nth-child(1) { background: var(--pink3);   animation-delay: 0s; }
  .h-dot:nth-child(2) { background: var(--purple3);  animation-delay: 0.3s; }
  .h-dot:nth-child(3) { background: var(--pink2);    animation-delay: 0.6s; width: 12px; height: 12px; }
  .h-dot:nth-child(4) { background: var(--purple2);  animation-delay: 0.9s; }
  .h-dot:nth-child(5) { background: var(--pink3);    animation-delay: 1.2s; }
  @keyframes pulse2 {
    0%,100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.5); opacity: 1; }
  }

  /* ── headline ── */
  .headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(36px, 8vw, 56px);
    font-weight: 700;
    font-style: italic;
    line-height: 1.15;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #f9c0dc 0%, #e86bb8 30%, #c97be0 60%, #b3a0ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmerText 4s ease-in-out infinite alternate;
    background-size: 200% auto;
  }
  @keyframes shimmerText {
    from { background-position: 0% center; }
    to   { background-position: 100% center; }
  }

  .name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(44px, 10vw, 68px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 4px;
    display: block;
    margin-bottom: 40px;
    text-shadow: 0 0 40px rgba(232,85,154,0.5), 0 0 80px rgba(155,89,208,0.3);
    animation: glow 3s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 30px rgba(232,85,154,0.4), 0 0 60px rgba(155,89,208,0.2); }
    to   { text-shadow: 0 0 50px rgba(232,85,154,0.7), 0 0 100px rgba(155,89,208,0.4), 0 0 140px rgba(185,122,224,0.2); }
  }

  /* ── divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 auto 32px;
    max-width: 300px;
  }
  .div-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,180,220,0.4));
  }
  .div-line.r { background: linear-gradient(90deg, rgba(255,180,220,0.4), transparent); }
  .div-diamond {
    width: 7px; height: 7px;
    background: var(--pink2);
    transform: rotate(45deg);
    border-radius: 1px;
    box-shadow: 0 0 10px rgba(232,85,154,0.8);
  }

  /* ── message ── */
  .message {
    font-family: 'Jost', sans-serif;
    font-size: clamp(15px, 3.5vw, 18px);
    font-weight: 300;
    color: rgba(255,240,250,0.88);
    line-height: 1.85;
    letter-spacing: 0.4px;
    margin-bottom: 44px;
  }
  .message em {
    font-family: 'Playfair Display', serif;
    font-size: 1.1em;
    font-style: italic;
    color: var(--pink3);
  }

  /* ── coming soon pill ── */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    border-radius: 100px;
    border: 1px solid rgba(255,180,220,0.3);
    background: rgba(232,85,154,0.1);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--pink3);
    animation: pillPulse 3s ease-in-out infinite;
    margin-bottom: 36px;
  }
  .pill-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pink2);
    animation: blink 1.5s ease-in-out infinite;
    box-shadow: 0 0 8px var(--pink);
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }
  @keyframes pillPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(232,85,154,0); }
    50%      { box-shadow: 0 0 0 6px rgba(232,85,154,0.08); }
  }

  /* ── heart at bottom ── */
  .bottom-heart {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 0 12px rgba(232,85,154,0.7));
    animation: heartbeat 2.5s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15%      { transform: scale(1.25); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.1); }
  }
</style>
</head>
<body>

<!-- aurora background -->
<div class="bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
</div>

<!-- stars -->
<div class="stars" id="stars"></div>

<!-- petals -->
<div class="petals" id="petals"></div>

<!-- card -->
<div class="card">
  <div class="hearts-row">
    <div class="h-dot"></div>
    <div class="h-dot"></div>
    <div class="h-dot"></div>
    <div class="h-dot"></div>
    <div class="h-dot"></div>
  </div>

  <div class="headline">Halo &amp; Happy Birthday</div>
  <span class="name">Mariam</span>

  <div class="divider">
    <div class="div-line"></div>
    <div class="div-diamond"></div>
    <div class="div-line r"></div>
  </div>

  <div class="pill">
    <div class="pill-dot"></div>
    Something is coming
  </div>

  <p class="message">
    My love,<br>
    something is about to happen on this website —<br>
    <em>so you better check it regularly.</em> ♡
  </p>

  <div class="bottom-heart">♡</div>
</div>

<script>
  // stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 2.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*5}s;
    `;
    starsEl.appendChild(s);
  }

  // petals
  const petalsEl = document.getElementById('petals');
  const colors = ['#f9c0dc','#d8b4f8','#f27bb8','#c4a0f0','#fbaed3','#b97ae0'];
  function spawnPetal() {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 6 + Math.random() * 10;
    const color = colors[Math.floor(Math.random()*colors.length)];
    const dur = 12 + Math.random() * 14;
    p.style.cssText = `
      width:${size}px; height:${size * 0.65}px;
      background:${color};
      left:${Math.random()*100}vw;
      top:-20px;
      animation-duration:${dur}s;
      animation-delay:0s;
      opacity:0.6;
    `;
    petalsEl.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000);
  }
  for (let i = 0; i < 14; i++) {
    setTimeout(spawnPetal, i * 900);
  }
  setInterval(spawnPetal, 1600);
</script>
</body>
</html>
